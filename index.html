<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript Login Form</title>

    <!-- PyScript link -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body { font-family: Arial; background-color: #f2f2f2; text-align: center; margin-top: 100px; }
        .login-box { width: 350px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 0px 10px gray; }
        input { width: 90%; padding: 10px; margin: 10px 0; font-size: 16px; }
        button { padding: 10px 20px; font-size: 18px; background-color: blue; color: white; border: none; cursor: pointer; }
        #output { margin-top: 20px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>User Login (Python)</h2>
        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="password" placeholder="Enter Password">
        <br><br>
        
        <!-- py-click ka use karke Python function call hoga -->
        <button py-click="login_function">Login</button>

        <div id="output"></div>
    </div>

    <!-- Python Logic starts here -->
    <script type="py">
        from pyscript import document

        def login_function(event):
            # Input fields se value lena
            username = document.querySelector("#username").value
            password = document.querySelector("#password").value
            output_div = document.querySelector("#output")

            # Logic check
            if username == "" or password == "":
                output_div.innerText = "Please fill all fields ❌"
                output_div.style.color = "red"
            else:
                output_div.innerText = f"Welcome {username}, Login Success! ✅"
                output_div.style.color = "green"
    </script>

</body>
</html>
