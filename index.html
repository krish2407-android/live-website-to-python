<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Brython Engine (Lightweight Python for Browser) -->
    <script type="text/javascript" src="https://jsdelivr.net"></script>
    <script type="text/javascript" src="https://jsdelivr.net"></script>
    <title>Palindrome Checker</title>
</head>
<body onload="brython()">
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h1>Python Result:</h1>
        <!-- Yahan output dikhega -->
        <h2 id="output" style="color: blue;">Processing...</h2>
    </div>

    <script type="text/python">
from browser import document

s = "malayalam"
i, j = 0, len(s) - 1
is_palindrome = True

while i < j:
    if s[i] != s[j]:
        is_palindrome = False
        break
    i += 1
    j -= 1

if is_palindrome:
    result = f"Yes, '{s}' is a palindrome!"
else:
    result = f"No, '{s}' is not a palindrome."

# Screen par result dikhane ke liye
document["output"].text = result
    </script>
</body>
</html>
