<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Palindrome Checker</title>
</head>
<body style="text-align: center; font-family: sans-serif; margin-top: 50px;">

    <h1>Palindrome Result:</h1>
    <h2 id="output" style="color: green;">Checking...</h2>

    <script>
        
        let s = "krish";
        let i = 0;
        let j = s.length - 1;
        let is_palindrome = true;

        while (i < j) {
            if (s[i] !== s[j]) {
                is_palindrome = false;
                break;
            }
            i++;
            j--;
        }

        let result = is_palindrome 
            ? `Yes, '${s}' is a palindrome!` 
            : `No, '${s}' is not a palindrome.`;

        
        document.getElementById("output").innerText = result;
    </script>
</body>
</html>
