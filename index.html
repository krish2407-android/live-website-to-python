<!DOCTYPE html>
<html>
<head>
    <!-- Python chalane ke liye ye library load hona zaroori hai -->
    <script type="module" src="https://pyscript.net"></script>
    <title>Pure Python Page</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h1>Python Language Result:</h1>
        <div id="output">Loading Python...</div>
    </div>

    <script type="py">
# YEH PURE PYTHON HAI
from pyscript import display

s = "malayalam"
i, j = 0, len(s)-1
is_pali = True

while i < j:
    if s[i] != s[j]:
        is_pali = False
        break
    i += 1
    j -= 1

msg = f"Yes, {s} is a palindrome" if is_pali else "No"
display(msg, target="output")
    </script>
</body>
</html>
