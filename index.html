<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Palindrome Checker</title>
    <!-- Sabse stable CSS aur JS links -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h1>Mera Python Output:</h1>
        <!-- Yahan result dikhega -->
        <div id="output" style="font-size: 28px; color: #2c3e50; font-weight: bold;">
            Python load ho raha hai...
        </div>
    </div>

    <script type="py">
from pyscript import display

s = "malayalam"
i, j = 0, len(s) - 1
is_palindrome = True

while i < j:
    if s[i] != s[j]:
        is_palindrome = False
        break
    i += 1
    j -= 1

if is_palindrome:
    result = f"Yes, '{s}' is a palindrome!"
else:
    result = f"No, '{s}' is not a palindrome."

# display function use karke output ko div mein bhej rahe hain
display(result, target="output", append=False)
    </script>
</body>
</html>
